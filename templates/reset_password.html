<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Senha — NutriTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>🔒 Nova Senha</h1>
      <p>Escolha uma nova senha para sua conta</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <div class="form-group">
        <label class="form-label">🔑 Nova senha</label>
        <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required autofocus minlength="6" />
      </div>
      <div class="form-group">
        <label class="form-label">🔑 Confirmar nova senha</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repita a senha" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-success btn-block" style="margin-top:8px;">
        Redefinir senha ✓
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:.88rem;color:var(--dim);">
      <a href="{{ url_for('auth.login') }}" style="color:var(--accent);font-weight:600;">← Voltar ao login</a>
    </p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
